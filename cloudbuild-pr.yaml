# Cloud Build: nginx (edge and origin, ModSecurity and the OWASP Core Rule Set) image for SitesPanel.
# Pull-request build: builds and scans only. Nothing is pushed and no secret is read.

substitutions:
  _REGISTRY: ghcr.io/sitespanel

steps:
  # The version tag comes from the Dockerfile.
  - id: version
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        v=$$(grep -oP '^ARG NGINX_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -n 1)
        [ -n "$$v" ] || { echo "could not read the version from the Dockerfile"; exit 1; }
        echo "$$v" > /workspace/version
        echo "version $$v"
    waitFor: ['-']
  - id: build-nginx
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/nginx-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --label=dev.sitespanel.build.id=$BUILD_ID
      - --label=org.opencontainers.image.description=SitesPanel nginx (edge and origin, ModSecurity and the OWASP Core Rule Set) image
      - --tag=${_REGISTRY}/nginx:$SHORT_SHA
      - --tag=${_REGISTRY}/nginx:latest
      - .
    waitFor: ['-']
  - id: scan-nginx
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-ceu', 'docker save --output /workspace/nginx.tar ${_REGISTRY}/nginx:$SHORT_SHA']
    waitFor: ['build-nginx']
  - id: trivy-nginx
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/nginx.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        rm -f /workspace/nginx.tar
    waitFor: ['scan-nginx']

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s
