# Cloud Build: nginx (edge and origin, ModSecurity and the OWASP Core Rule Set) image for SitesPanel.
# Pull-request build: builds and scans only. Nothing is pushed and no secret is used, so it is
# safe for pull requests; the trigger still requires a maintainer comment for outside contributors.

substitutions:
  _AR_HOST: europe-docker.pkg.dev
  _AR_REPOSITORY: sitespanel-images

steps:
  # The version tag comes from the Dockerfile, as in the old GitHub workflow.
  - id: version
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        v=$$(grep -oP '^ARG NGINX_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -n 1)
        [ -n "$$v" ] || { echo "could not read the version from the Dockerfile"; exit 1; }
        echo "$$v" > /workspace/version
        echo "version $$v"
    waitFor: ['-']
  - id: build-nginx
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/nginx-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/nginx:$SHORT_SHA
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/nginx:latest
      - .
    waitFor: ['-']
  - id: save-nginx
    name: gcr.io/cloud-builders/docker
    args: ['save', '--output', '/workspace/nginx.tar', '${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/nginx:$SHORT_SHA']
    waitFor: ['build-nginx']
  - id: scan-nginx
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/nginx.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
    waitFor: ['save-nginx']

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s
